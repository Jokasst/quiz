<!DOCTYPE html>
<html>
    <head>
        <style>
            html {
                background: #f2f4f7;
                min-height: 100%;
            }

            body {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                max-width: 480px;
                margin: 48px auto;
                padding: 32px 28px;
                background: #ffffff;
                border-radius: 14px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
                color: #1f2430;
                text-align: center;
            }

            h1 {
                font-size: 1.6rem;
                margin-bottom: 8px;
            }

            #status-message {
                min-height: 1.4em;
                font-weight: 600;
                color: #4b5563;
                margin-bottom: 16px;
            }

            #quiz-container {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 20px;
            }

            #quiz-container h2 {
                font-size: 1.2rem;
                margin-bottom: 8px;
                color: #111827;
            }

            .option-btn {
                padding: 12px 16px;
                font-size: 1rem;
                border: 2px solid #e2e5ea;
                border-radius: 10px;
                background: #f9fafb;
                color: #1f2430;
                cursor: pointer;
                text-align: left;
                transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
            }

            .option-btn:hover:not(:disabled) {
                border-color: #6366f1;
                background: #eef2ff;
            }

            .option-btn:active:not(:disabled) {
                transform: scale(0.98);
            }

            .option-btn:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }

            #next-btn, #restart-btn, #new-test-btn {
                padding: 12px 24px;
                font-size: 1rem;
                font-weight: 600;
                border: none;
                border-radius: 10px;
                background: #6366f1;
                color: #ffffff;
                cursor: pointer;
                margin: 4px;
                transition: background 0.15s ease;
            }

            #next-btn:hover {
                background: #4f46e5;
            }

            #restart-btn {
                background: #10b981;
            }

            #restart-btn:hover {
                background: #059669;
            }

            #new-test-btn {
                background: #f59e0b;
            }

            #new-test-btn:hover {
                background: #d97706;
            }
        </style>
    </head>
    <body>
        <h1>Quiz</h1>
        <p id="status-message"></p>

        <div id="quiz-container"></div>

        <button id="next-btn" style="display: none;">Next</button>
        <button id="restart-btn" style="display: none;">Try again</button>
        <button id="new-test-btn" style="display: none;">Next quiz</button>

        <script>
            class Question {
                constructor(text, options, correctAnswer) {
                    this.text = text;
                    this.options = options;
                    this.correctAnswer = correctAnswer;
                }
            }

            let questions = [];
            let currentIndex = 0;
            let score = 0;

            questions = []

            function renderQuestion() {
                const container = document.getElementById("quiz-container")
                container.innerHTML = "";

                const currentQuestion = questions[currentIndex]

                const questionText = document.createElement("h2")
                questionText.textContent = currentQuestion.text
                container.appendChild(questionText)

                currentQuestion.options.forEach(function(option) {
                    const btn = document.createElement("button")
                    btn.textContent = option;
                    btn.classList.add("option-btn")
                    container.appendChild(btn)
                })
            }

            const quizContainer = document.getElementById("quiz-container")

            quizContainer.addEventListener("click", function(event) {
                if (event.target.classList.contains("option-btn")) {
                    const btnOption = event.target.textContent
                    const currentQuestion = questions[currentIndex]

                    if (btnOption === currentQuestion.correctAnswer) {
                        score += 1

                        console.log(score)
                    } 

                    const blockBtn = document.querySelectorAll(".option-btn")
                    blockBtn.forEach(function(oneItem) {
                        oneItem.disabled = true
                    })

                    const nextBtn = document.getElementById("next-btn")
                    nextBtn.style.display = ""

                }
            })

            const nextBtn = document.getElementById("next-btn")

            nextBtn.addEventListener("click", function() {
                currentIndex += 1;
                nextBtn.style.display = "none"

                if (currentIndex === questions.length) {
                    if (score === questions.length) {
                        document.getElementById("status-message").textContent = "Excellent job! Your score is " + score + " points out of " + questions.length
                    } else if (score > questions.length / 2) {
                        document.getElementById("status-message").textContent = "You've passed the test. Your score is " + score + " points out of " + questions.length
                    } else {
                        document.getElementById("status-message").textContent = "You've failed. Your score is " + score + " points out of " + questions.length
                    }
                    quizContainer.style.display = "none"
                    restartBtn.style.display = ""
                    newTestBtn.style.display = ""
                    
                } else {
                    renderQuestion()
                }

            })

            const restartBtn = document.getElementById("restart-btn")

            restartBtn.addEventListener("click", function() {
                document.getElementById("status-message").textContent = ""
                newTestBtn.style.display = "none"
                restartBtn.style.display = "none"
                score = 0;
                currentIndex = 0;

                quizContainer.style.display = ""
                renderQuestion()
            })

            const newTestBtn = document.getElementById("new-test-btn")

            newTestBtn.addEventListener("click", function() {
                newTestBtn.style.display = "none"
                restartBtn.style.display = "none"
                score = 0;
                currentIndex = 0;
                quizContainer.style.display = ""
                questions = [];

                loadQuestions()
            })

            async function loadQuestions() {
                try {
                    document.getElementById("status-message").textContent = "Loading the questions..."
                    const response = await fetch("https://opentdb.com/api.php?amount=5&type=multiple")
                    const data = await response.json()

                    data.results.forEach(function(question) {

                        function decodeHTML(encodedString) {
                            const textarea = document.createElement("textarea")
                            textarea.innerHTML = encodedString
                            return textarea.value
                        }

                        const decodedIncorrect = question.incorrect_answers.map(function(oneItem) {
                            return decodeHTML(oneItem)
                        })

                        const allQuestions = [decodeHTML(question.correct_answer), ...decodedIncorrect]
                        questions.push(new Question(decodeHTML(question.question), allQuestions, decodeHTML(question.correct_answer)))
                        allQuestions.sort(() => Math.random() - 0.5)
                        
                    })

                    if (questions.length === 0) {
                    document.getElementById("status-message").textContent = "Something is wrong with the data. Try restarting the page"
                    } else {
                        renderQuestion()
                        document.getElementById("status-message").textContent = ""
                    }


                } catch (error) {
                    console.log("Error:", error.name)
                    console.log(error.message)
                    document.getElementById("status-message").textContent = "Something went wrong with the data. Try later."
                }
            }

            loadQuestions()
        </script>
    </body>
</html>
